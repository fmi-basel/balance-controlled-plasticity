defaults:
  - hydra: default
  - model: default
  - trainer: bcp
  - optimizer: adam
  - scheduler: constant
  - tracker: weights
  - _self_

out_dir : out/static  # Directory to save model and log files.

# RNG
seed: False  # Random seed. If False, use random seed
derive_seeds: False 
jax_threefry_partitionable: True  

# Performance
device : 'gpu'  # 'cpu' or 'gpu'
gpu_id : 0      # GPU ID to use
precision: float32  # float16, float32 or bfloat16

# Training
epochs: 50
epochs_pretrain_fb: 0   # FF-frozen feedback (Q) pre-training epochs; requires feedback_mode=learned*
batchsize: 100
eval_interval: 1
verbose: True
OL_eval_on_train: True 

# Tracking & Debug options
batchwise_tracker: False  # Whether to track on a batch-wise basis
tracking: True
