defaults: 
  - defaults
  - _self_

_target_: bcp.models.assemblies.trainer_learnedfb.LearnedFeedbackBalanceControlled

# Feedback source:
#   analytic            (network Jacobian)
#   random              (fixed random FB)
#   learned             (learned-singlephase)
#   learned-singlephase (learned-singlephase)
#   learned-twophase    (extra phase for FB learning)

feedback_mode: learned-twophase

# FB weight modifications
average_fb_weights: False
clip_fb_weights: False
clip_val: 1.0
# Analytic FB is normalized when applied. Learned FB instead normalizes the stored Q
# at initialization and after each Q update (using the norm of Q @ M_I.T).
norm_fb_weights: False
norm_val: 1.0
clip_params: True
clip_val_params: 1.0

# Gradient norm
norm_grads: False
clip_grads: False
clip_val_grads: 0.1

# FB strength
strong_fb: True
target_nudge: 0.015

# Learning rule
activity_reg_strength: 0.0
gate_by_derivative: False
use_fr_error: False

# Learned feedback (Q) — only active when feedback_mode starts with 'learned'
q_lr: 1e-3            # LR of the dedicated Q optimizer during joint (FF+Q) training
q_lr_pretraining: null  # LR of the Q optimizer during FF-frozen pretraining; null -> q_lr
q_update_every: 1
q_init_scale: 0.01      # learned Q scale only when norm_fb_weights=False
q_seed: 0

# Fixed-step solver for the noisy feedback dynamics
noisy_solver: euler
# Timestep used only by the separate noisy Q-learning solve in FF-frozen
# pretraining and learned-twophase training. All other solves use model.dt.
fb_learning_dt: 1e-2

# Optional steady assembly-space drive during the separate noisy Q-learning phase.
# It is projected through M_E/M_I and is invalid for single-phase learning.
inject_current_during_fb_learning: False
fb_learning_current: 1.0
