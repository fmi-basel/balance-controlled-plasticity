defaults:
  - activation/relu@actE
  - activation/relu@actI
  - controller: leaky-pi
  - defaults
  - _self_

_target_: bcp.models.assemblies.vf_learnedfb.LearnedFeedbackAssemblyVectorField

# RNG KEY FOR MEMBERSHIP
RNG_Key: ${seed}

# Architecture
nb_hidden: 1
sizes_hidden: [128]
use_bias: True
nb_exc_per_ensemble: 16
EI_ratio: 4.0

# Dynamics
fb_to_readout: True
tauI: 10e-3
tauE: 30e-3
tauOut: 30e-3

# Initialization
FF_init: 'default'

# EI connectivity
overlap: 0.0
g_EI: 'default'
g_XI: 1.0
g_EE: 0.0
g_II: 0.0
alpha: 0.5

# Jacobian
inh_deriv_in_jac: True

# Learned-feedback noise rule
# (sigma / tau_eps may be scalars or per-layer lists [l=0 deepest .. l=L-1 proximal])
sigma: 0.6              # OU noise amplitude injected (per-assembly) into interneurons (studentteacher-tuned; paper ~0.005)
tau_eps: 0.05           # OU correlation time (keep <~ tau_filt_post; << tau_filt_presyn)
# Filter timescales: each is the leaky-integrator time constant that PRODUCES the like-named trace.
tau_filt_presyn: 0.1    # SLOW low-pass -> FF-presyn debias trace h_lp (paper τ_f)
tau_filt_ctrl: 0.01     # FAST low-pass -> control trace c_lp; teach = ctrl - c_lp (high-pass); ~a few×tau_eps.
                        # Do NOT set this near T: a slow control high-pass leaves a DC in the teach signal that
                        # contaminates the Q source with an off-manifold term so FB subspace alignment will not climb.
tau_filt_post: 0.05     # low-pass -> inhibitory membrane trace u_inh_lp (the post factor; slower cleans the deep-layer source)
beta: 0.001            # Q leak for raw Q; ignored when trainer.norm_fb_weights=True
signal_source: membrane   # 'membrane' = low-pass(u_inh) | 'compartment' = Qu+σε (paper v^fb)
update_sign: 1.0          # sign of the anti-Hebbian source (validate empirically)
t_settle: 0.1             # gate Q-source accumulation to t > t_settle
# layer scaling s_l = (1 + (tauE+tauI)/tau_eps)^(L-1-l) is derived from the time constants
