_target_: bcp.onlinelearning.ExcInhAssemblyOnlineLearningVF

# Network dimensions
data_dim: 20
nb_ensembles: 20
nb_exc: 240
nb_inh: 60
nb_outputs: 2

# Dynamics
actE:
  _target_: bcp.core.activation.ReLU
actI:
  _target_: bcp.core.activation.ReLU
tauE: 30e-3
tauI: 20e-3
tauOut: 30e-3
tauPre: 30e-3
overlap: 0.0

# Network connectivity
g_EI: 'default'
g_XI: 1.0
g_II: 0.0
g_EE: 0.0

# Top-down feedback
global_fb: False
random_fb_per_ensemble: False
random_fb_per_neuron: False
only_disinhibitory_feedback: False
feedback_to_excitatory: False

# Controller
controller:
  _target_: bcp.core.LeakyPIController
  dim_output: 2
  loss: 
    _target_: bcp.core.losses.MSE
    name: 'MSE'
  k_p: 5
  k_i: 0.0
  leak: 1.0
  tau: 100e-3

# Learning
eta_OUT: 0.2
eta_FF: 0.2
eta_EE: 0.0
alpha: 0.5
use_bias: True

clip_weights: True
clip_val: 1.0
weight_decay: 0.0

gEE_min: 0.0
gEE_max: 'default'
