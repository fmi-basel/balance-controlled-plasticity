_target_: bcp.onlinelearning.E_PV_VIP_SOM_OnlineLearningVF

# Network dimensions
data_dim: 20
nb_ensembles: 20
nb_exc: 240
nb_som: 40
nb_pv: 10
nb_vip: 40
nb_outputs: 2

# Dynamics
actE:
  _target_: bcp.core.activation.ReLU
actSOM:
  _target_: bcp.core.activation.ReLU
actPV:
  _target_: bcp.core.activation.ReLU
actVIP:
  _target_: bcp.core.activation.ReLU
tauE: 30e-3
tauSOM: 20e-3
tauPV: 10e-3
tauVIP: 20e-3
tauOut: 20e-3
tauPre: 30e-3

# Network connectivity
g_ESOM: 1.05
g_XSOM: 0.52
g_SOMSOM: 0.0
g_EE: 0.35

# PV population
g_XPV: 0.46
g_PVPV: 0.13
g_EPV: 0.9
g_SOMPV: 0.14
sparsity_to_PV: 1.0  # connection probability for X/PV/E/SOM -> PV weights (1.0 = no sparsity)

# VIP population
g_VIPSOM: 0.49      # VIP -> SOM inhibition 
g_SOMVIP: 0.14      # reciprocal SOM -> VIP 
g_EVIP: 0.93        # E -> VIP 
g_base_VIP: 3.0    # VIP background gain
control_to_vip_only: True  # True: FB -> VIP only; False: split VIP/SOM

# Controller
controller:
  _target_: bcp.core.LeakyPIController
  dim_output: 2
  loss:
    _target_: bcp.core.losses.MSE
    name: 'MSE'
  k_p: 5
  k_i: 0.0
  leak: 1.0
  tau: 100e-3

# Learning
eta_OUT: 0.4
eta_FF: 0.4
alpha: 0.5
use_bias: True

clip_weights: False
clip_val: 1.0
weight_decay: 0.0
