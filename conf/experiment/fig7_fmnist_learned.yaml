# @package _global_

defaults:
  - /dataset: fmnist
  - override /model/vf: assemblies-learnedfb

device: gpu
jax_threefry_partitionable: True
epochs: 50
epochs_pretrain_fb: 5
batchsize: 100

model:
  T: 2.0
  vf:
    nb_hidden: 3
    sigma: [0.85, 1.34, 2.83]
    tau_eps: [0.189, 0.107, 0.03]
    tau_filt: 4.0
    signal_source: membrane
    controller:
      k_p: 0.59
      k_i: 0.044
      tau: 0.4

optimizer:
  learning_rate: 0.001

trainer:
  feedback_mode: learned-twophase
  q_lr: 0.0001
  q_lr_pretraining: 0.005
  fb_learning_dt: 0.01
  q_update_every: 1
  norm_fb_weights: True
  norm_val: 1.0

hydra:
  sweep:
    dir: out/fig7_fmnist_learned
    subdir: seed${seed}
  sweeper:
    params:
      seed: 1,2,3,4,5
